<title>Social Pulse — Social Analytics Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
:root{
  color-scheme:light;
  --page:#f3f6fa; --surface:#ffffff; --surface-2:#f5f8fc; --surface-3:#eaf1f9;
  --ink:#12161d; --secondary:#59636f; --muted:#8b95a3;
  --hairline:#e8edf3; --hairline-2:#d9e1ea;
  --blue:#2c93ff; --blue-ink:#1178e6; --blue-strong:#0e6fe0; --blue-soft:#e7f1ff;
  --orange:#ff7a1a; --orange-ink:#d65e00; --orange-soft:#fff0e2;
  --good:#0a9a3f; --good-ink:#07822f; --good-soft:#e4f6ea; --crit:#d8443a; --crit-ink:#bd3229; --crit-soft:#fdeceb;
  --s-linkedin:#2c93ff; --s-youtube:#ff7a1a; --s-tiktok:#1baf7a; --s-instagram:#e87ba4; --s-twitter:#4a3aa7; --s-facebook:#1f9d55;
  --grid:#eaeff5; --axis:#d4dde7;
  --shadow:0 1px 2px rgba(18,30,50,.04), 0 12px 30px -14px rgba(18,40,80,.16);
  --shadow-lg:0 2px 4px rgba(18,30,50,.05), 0 28px 56px -22px rgba(18,40,80,.24);
  --r:16px; --r-sm:11px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0b0f16; --surface:#151b24; --surface-2:#111823; --surface-3:#1c2632;
  --ink:#eaf1f8; --secondary:#9aa6b5; --muted:#657182;
  --hairline:#1f2833; --hairline-2:#2a3542;
  --blue:#3e9bff; --blue-ink:#7dbbff; --blue-strong:#8cc3ff; --blue-soft:#14263b;
  --orange:#ff8a33; --orange-ink:#ffa860; --orange-soft:#2a1d12;
  --good:#2bb45a; --good-ink:#4cc873; --good-soft:#13251a; --crit:#ef5f56; --crit-ink:#f38178; --crit-soft:#2a1614;
  --s-linkedin:#3987e5; --s-youtube:#d95926; --s-tiktok:#199e70; --s-instagram:#d55181; --s-twitter:#9085e9; --s-facebook:#35c46e;
  --grid:#1a2430; --axis:#2a3542;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -16px rgba(0,0,0,.7);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 30px 60px -24px rgba(0,0,0,.85);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --page:#0b0f16; --surface:#151b24; --surface-2:#111823; --surface-3:#1c2632;
  --ink:#eaf1f8; --secondary:#9aa6b5; --muted:#657182;
  --hairline:#1f2833; --hairline-2:#2a3542;
  --blue:#3e9bff; --blue-ink:#7dbbff; --blue-strong:#8cc3ff; --blue-soft:#14263b;
  --orange:#ff8a33; --orange-ink:#ffa860; --orange-soft:#2a1d12;
  --good:#2bb45a; --good-ink:#4cc873; --good-soft:#13251a; --crit:#ef5f56; --crit-ink:#f38178; --crit-soft:#2a1614;
  --s-linkedin:#3987e5; --s-youtube:#d95926; --s-tiktok:#199e70; --s-instagram:#d55181; --s-twitter:#9085e9; --s-facebook:#35c46e;
  --grid:#1a2430; --axis:#2a3542;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -16px rgba(0,0,0,.7);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 30px 60px -24px rgba(0,0,0,.85);
}}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--page); color:var(--ink); font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased}
.tnum{font-variant-numeric:tabular-nums} h1,h2,h3{margin:0; letter-spacing:-.015em} button{font-family:inherit; cursor:pointer}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--orange-ink)}

.app{display:grid; grid-template-columns:250px 1fr; min-height:100vh}
.sidebar{position:sticky; top:0; height:100vh; align-self:start; background:var(--surface); border-right:1px solid var(--hairline); display:flex; flex-direction:column; padding:22px 15px; gap:22px}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px}
.brand-mark{width:32px; height:32px; flex:0 0 auto}
.brand-txt{font-weight:700; font-size:17px; letter-spacing:-.02em}
.brand-txt .b{color:var(--blue-ink)} .brand-txt .ai{color:var(--blue-ink)}
.brand-txt small{display:block; font-size:9.5px; font-weight:600; letter-spacing:.18em; color:var(--muted); text-transform:uppercase; margin-top:2px}
.nav{display:flex; flex-direction:column; gap:2px} .nav-h{font-size:10px; font-weight:700; letter-spacing:.16em; color:var(--muted); text-transform:uppercase; padding:10px 12px 6px}
.nav-btn{display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:transparent; border:0; color:var(--secondary); padding:10px 12px; border-radius:var(--r-sm); font-size:13.5px; font-weight:500; transition:.14s}
.nav-btn:hover{background:var(--surface-2); color:var(--ink)}
.nav-btn.active{background:var(--blue-soft); color:var(--blue-strong); font-weight:600}
.nav-btn svg{width:18px; height:18px; flex:0 0 auto; stroke:currentColor; fill:none; stroke-width:1.7}
.nav-btn .n{margin-left:auto; font-size:11px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums}
.nav-btn.active .n{color:var(--blue-strong)}
.side-foot{margin-top:auto; padding:14px 12px 2px; border-top:1px solid var(--hairline); font-size:11.5px; color:var(--muted); line-height:1.6}
.side-foot b{color:var(--secondary)}
.tag-live{display:inline-flex; align-items:center; gap:6px; font-size:9.5px; font-weight:700; letter-spacing:.1em; color:var(--good-ink); margin-bottom:9px}
.tag-live i{width:7px; height:7px; border-radius:50%; background:var(--good)}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--page) 84%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--hairline); display:flex; align-items:center; gap:16px; padding:16px 32px}
.topbar h1{font-size:21px; font-weight:700}
.topbar-r{margin-left:auto; display:flex; align-items:center; gap:10px}
.pill{display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:100px; background:var(--blue-soft); color:var(--blue-strong); font-size:12.5px; font-weight:600}
.pill i{width:7px; height:7px; border-radius:50%; background:var(--blue)}
.icon-btn{width:38px; height:38px; display:grid; place-items:center; border-radius:10px; border:1px solid var(--hairline-2); background:var(--surface); color:var(--secondary); transition:.14s}
.icon-btn:hover{color:var(--ink); border-color:var(--blue)} .icon-btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8}
.menu-btn{display:none}
.content{padding:26px 32px 64px; max-width:1260px; width:100%}
.page{display:none} .page.active{display:block; animation:f .35s ease}
@keyframes f{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.sec{margin:40px 0 16px} .sec:first-child{margin-top:6px}
.sec .eyebrow{display:block; margin-bottom:7px} .sec h2{font-size:19px; font-weight:700} .sec .hint{font-size:12.5px; color:var(--muted); margin-top:4px}
.grid{display:grid; gap:16px} .two{grid-template-columns:1fr 1fr}
.card{background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r); padding:20px; box-shadow:var(--shadow)}
.card-t{font-size:14px; font-weight:700} .card-s{font-size:12px; color:var(--muted); margin:4px 0 15px}

.hero{position:relative; overflow:hidden; background:radial-gradient(130% 120% at 100% 0%, var(--blue-soft), transparent 60%), var(--surface); border:1px solid var(--hairline); border-radius:var(--r); padding:32px 30px; box-shadow:var(--shadow-lg)}
.hero .ghost{position:absolute; right:-8px; top:-24px; font-size:200px; font-weight:700; line-height:1; letter-spacing:-.04em; color:var(--blue); opacity:.06; pointer-events:none; font-variant-numeric:tabular-nums; user-select:none}
.hero-in{position:relative; z-index:1}
.hero h2{font-size:clamp(28px,4.2vw,44px); font-weight:700; line-height:1.06; letter-spacing:-.03em; margin-top:12px}
.hero h2 .hl{color:var(--blue-ink)} .hero .lede{color:var(--secondary); font-size:14.5px; margin-top:16px; max-width:64ch; line-height:1.6} .hero .lede b{color:var(--ink); font-weight:600}
.kpis{grid-template-columns:repeat(4,1fr); margin-top:16px}
.kpi{background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r); padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--blue)} .kpi.hot::before{background:var(--orange)}
.kpi .kl{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:11px} .kpi.hot .kl{color:var(--orange-ink)}
.kpi .kv{font-size:29px; font-weight:700; line-height:1; letter-spacing:-.025em} .kpi .kv small{font-size:15px; color:var(--secondary); font-weight:600}
.kpi .kf{margin-top:10px; font-size:11.5px; color:var(--muted)}

/* comparison delta cards */
.dcards{grid-template-columns:repeat(3,1fr)}
.dcard{background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r); padding:18px 20px; box-shadow:var(--shadow)}
.dcard .dl{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.dcard .dv{font-size:30px; font-weight:700; letter-spacing:-.025em; margin-top:10px; line-height:1} .dcard .dv small{font-size:16px; color:var(--secondary); font-weight:600}
.dcard .dr{margin-top:10px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px}
.delta{display:inline-flex; align-items:center; gap:3px; font-weight:700; font-variant-numeric:tabular-nums; font-size:12.5px; padding:2px 8px; border-radius:100px}
.delta.up{color:var(--good-ink); background:var(--good-soft)} .delta.down{color:var(--crit-ink); background:var(--crit-soft)} .delta.flat{color:var(--muted); background:var(--surface-3)}
.delta svg{width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2.6}
.delta.mini{padding:1px 6px; font-size:11px}

.cw{position:relative}
svg text{fill:var(--muted); font-family:"DM Sans",sans-serif; font-size:10px}
.tooltip{position:fixed; pointer-events:none; z-index:60; opacity:0; transition:opacity .12s; background:var(--surface); border:1px solid var(--hairline-2); border-radius:11px; box-shadow:var(--shadow-lg); padding:10px 12px; font-size:12px; min-width:150px; transform:translate(-50%,-116%)}
.tooltip .tt-t{font-weight:700; font-size:12px; margin-bottom:6px} .tooltip .tt-r{display:flex; justify-content:space-between; gap:16px; color:var(--secondary); padding:1px 0} .tooltip .tt-r b{color:var(--ink); font-variant-numeric:tabular-nums; font-weight:600}
.bars{display:flex; flex-direction:column; gap:12px}
.bar{display:grid; grid-template-columns:132px 1fr auto; align-items:center; gap:13px}
.bar .bl{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:500} .bar .sw{width:9px; height:9px; border-radius:2px; flex:0 0 auto}
.bar .trk{height:20px; background:var(--surface-3); border-radius:6px; overflow:hidden} .bar .fl{height:100%; border-radius:6px; width:0; transition:width .9s cubic-bezier(.22,1,.36,1)}
.bar .bv{font-size:12.5px; font-weight:700; min-width:60px; text-align:right; font-variant-numeric:tabular-nums} .bar .bs{font-size:11px; color:var(--muted); font-weight:500}

.trow{display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr; align-items:center; padding:12px 2px; border-top:1px solid var(--hairline)} .trow:first-child{border-top:0}
.trow .lb{font-size:12.5px; color:var(--secondary)} .trow .vv{text-align:right; font-variant-numeric:tabular-nums; font-weight:600; font-size:13px}
.trow .hd{font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:right} .trow .hd:first-child{text-align:left}

.ins{display:flex; gap:14px; padding:14px 2px; border-top:1px solid var(--hairline)} .ins:first-child{border-top:0}
.ins .mk{width:28px; height:28px; border-radius:9px; flex:0 0 auto; display:grid; place-items:center; background:var(--blue-soft); color:var(--blue-strong)}
.ins.win .mk{background:var(--good-soft); color:var(--good-ink)} .ins.risk .mk{background:var(--orange-soft); color:var(--orange-ink)}
.ins .mk svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9} .ins .ib{font-size:13.5px; line-height:1.55} .ins .ib b{font-weight:700}
.post{display:grid; grid-template-columns:auto 1fr auto; gap:15px; align-items:center; padding:14px 2px; border-top:1px solid var(--hairline)} .post:first-child{border-top:0}
.post .pr{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; width:58px; text-align:center; color:var(--good-ink)}
.post .pt{font-size:13px; line-height:1.4; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.post .pm{font-size:11.5px; color:var(--muted); margin-top:6px; display:flex; gap:9px; align-items:center; font-weight:500} .post .pm .sw{width:8px;height:8px;border-radius:2px}
.post .pn{text-align:right; font-size:11.5px; color:var(--secondary); font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500}

.tblwrap{overflow-x:auto}
.tbl{width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px}
.tbl th{text-align:right; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:0 11px 11px; border-bottom:1px solid var(--hairline-2); white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:11px; border-bottom:1px solid var(--hairline); text-align:right; font-variant-numeric:tabular-nums; font-weight:500} .tbl tr:last-child td{border-bottom:0} .tbl tr:hover td{background:var(--surface-2)}
.tbl .nm{display:flex; align-items:center; gap:9px; font-weight:600} .tbl .sw{width:9px;height:9px;border-radius:2px; flex:0 0 auto}
.tbl .cell{display:flex; flex-direction:column; align-items:flex-end; gap:3px} .tbl .cell .cd{font-size:10.5px; white-space:nowrap} .tbl .cabs{color:var(--muted); font-weight:600}
.chip{display:inline-block; padding:2px 9px; border-radius:100px; font-weight:700; font-size:11.5px}
.chip.g{background:var(--good-soft); color:var(--good-ink)} .chip.m{background:var(--surface-3); color:var(--secondary)} .chip.l{background:var(--crit-soft); color:var(--crit-ink)}
.dc{display:inline-flex; align-items:center; gap:2px; font-weight:700} .dc.up{color:var(--good-ink)} .dc.down{color:var(--crit-ink)} .dc.flat{color:var(--muted)}
.tbl td.wk-hi{color:var(--good-ink); font-weight:700} .tbl td.wk-lo{color:var(--muted)}
.tbl tr.wk-cur td{background:var(--blue-soft)}

.vs-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px} .vs-nm{display:flex; align-items:center; gap:8px; font-weight:700; font-size:13px}
.sline{display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--hairline); font-size:12.5px} .sline:first-of-type{border-top:0} .sline .sl{color:var(--secondary)} .sline b{font-variant-numeric:tabular-nums; font-weight:600}
.note{font-size:11.5px; line-height:1.65; color:var(--secondary); margin-top:14px; padding:12px 14px; background:var(--surface-2); border-left:3px solid var(--blue); border-radius:0 9px 9px 0} .note.o{border-left-color:var(--orange)} .note b{color:var(--ink); font-weight:700}
.heat{overflow-x:auto} .heat table{border-collapse:separate; border-spacing:5px; min-width:540px}
.heat th{font-size:10px; color:var(--muted); font-weight:600; padding:2px} .heat th.rh{text-align:right; padding-right:8px}
.heat td{width:66px; height:38px; border-radius:9px; text-align:center; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums} .heat td.e{background:var(--surface-3); color:var(--muted); font-weight:400}
.leg{display:flex; align-items:center; gap:8px; margin-top:13px; font-size:11px; color:var(--muted); font-weight:500} .leg .rmp{display:flex; gap:2px} .leg .rmp i{width:22px;height:9px;border-radius:2px;display:block}
.mini{display:flex; flex-wrap:wrap; gap:22px} .mini .m{flex:1; min-width:120px} .mini .mv{font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em} .mini .mv small{font-size:14px;color:var(--secondary)} .mini .ml{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-top:5px}
.foot{margin-top:44px; padding-top:18px; border-top:1px solid var(--hairline); font-size:11.5px; line-height:1.75; color:var(--muted)} .foot b{color:var(--secondary)}
.ask-box{display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--hairline-2); border-radius:14px; padding:2px 16px; box-shadow:var(--shadow); max-width:700px}
.ask-box:focus-within{border-color:var(--blue)}
.ask-box .ask-ic{width:20px; height:20px; stroke:var(--muted); fill:none; stroke-width:2; flex:0 0 auto}
.ask-box input{flex:1; border:0; background:transparent; color:var(--ink); font-family:inherit; font-size:16px; padding:15px 0; outline:none}
.ask-chips{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 4px; max-width:860px}
.ask-chip{font-family:inherit; font-size:12.5px; color:var(--secondary); background:var(--surface-2); border:1px solid var(--hairline); border-radius:100px; padding:7px 13px; cursor:pointer; transition:.14s}
.ask-chip:hover{border-color:var(--blue); color:var(--blue-strong); background:var(--blue-soft)}
.ask-card{margin-top:20px; max-width:700px; animation:f .3s ease}
.ask-card .ask-q{font-size:12.5px; color:var(--muted); margin-bottom:12px}
.ask-card .ask-val{font-size:clamp(30px,5vw,42px); font-weight:700; letter-spacing:-.025em; line-height:1.05; color:var(--ink)}
.ask-card .ask-scope{font-size:14.5px; color:var(--secondary); font-weight:600; margin-top:11px}
.ask-card .ask-note{font-size:11.5px; color:var(--muted); margin-top:9px}
.ask-card .ask-extra{display:inline-block; font-size:13.5px; font-weight:700; margin-top:12px; padding:4px 11px; border-radius:100px; background:var(--blue-soft); color:var(--blue-strong)}
.ask-card.miss .ask-miss{font-size:13.5px; color:var(--secondary); line-height:1.55}
.ask-top{display:flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--hairline-2); border-radius:100px; padding:7px 13px}
.ask-top svg{width:15px; height:15px; stroke:var(--muted); fill:none; stroke-width:2; flex:0 0 auto}
.ask-top input{border:0; background:transparent; color:var(--ink); font-family:inherit; font-size:13px; outline:none; width:150px}
@media (max-width:820px){.ask-top{display:none}}
.ptools{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
.ptools input,.ptools select{font-family:inherit; font-size:13px; padding:9px 12px; border:1px solid var(--hairline-2); border-radius:10px; background:var(--surface); color:var(--ink)}
.ptools input{min-width:260px} .ptools input:focus,.ptools select:focus{outline:none; border-color:var(--blue)}
.ptools .pcount{margin-left:auto; font-size:12px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums}
.pwrap{overflow:auto; max-height:74vh; border:1px solid var(--hairline); border-radius:var(--r); box-shadow:var(--shadow)}
.ptable{border-collapse:separate; border-spacing:0; font-size:12px; min-width:1500px; width:100%; background:var(--surface)}
.ptable th{position:sticky; top:0; z-index:2; background:var(--surface-2); font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:11px 12px; border-bottom:1px solid var(--hairline-2); white-space:nowrap; cursor:pointer; user-select:none}
.ptable th.r{text-align:right} .ptable th.l{text-align:left} .ptable th:hover{color:var(--ink)}
.ptable td{padding:9px 12px; border-bottom:1px solid var(--hairline); white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--ink)}
.ptable td.r{text-align:right} .ptable td.l{text-align:left}

const PCOL={LinkedIn:'--s-linkedin',YouTube:'--s-youtube',TikTok:'--s-tiktok',Instagram:'--s-instagram','Twitter/X':'--s-twitter',Facebook:'--s-facebook'};
const sw=p=>`<span class="sw" style="background:${css(PCOL[p]||'--blue')}"></span>`;
const UP='<svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></svg>', DN='<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>';
function pctDelta(now,prev){ if(!prev) return now?{t:'new',c:'up'}:{t:'—',c:'flat'}; const d=(now-prev)/prev*100; return {t:(d>=0?'+':'')+Math.round(d)+'%',c:d>0.5?'up':d<-0.5?'down':'flat',v:d}; }
function ppDelta(now,prev){ const d=now-prev; return {t:(d>=0?'+':'')+d.toFixed(1)+'pp',c:d>0.05?'up':d<-0.05?'down':'flat',v:d}; }
function absDelta(now,prev){ const d=now-prev; return (d>=0?'+':'−')+fmt(Math.abs(d)); }
function deltaChip(d,mini){ const ar=d.c==='up'?UP:d.c==='down'?DN:''; return `<span class="delta ${d.c}${mini?' mini':''}">${ar}${d.t}</span>`; }
function dcInline(d){ const ar=d.c==='up'?'▲':d.c==='down'?'▼':'·'; return `<span class="dc ${d.c}">${ar} ${d.t}</span>`; }
const chip=r=>`<span class="chip ${r>=3?'g':r>=1.5?'m':'l'}">${r.toFixed(1)}%</span>`;

/* ---- charts ---- */
function line(el,rows,key,keyfmt){
  const W=560,H=210,pad={l:46,r:16,t:16,b:30};
  const vals=rows.map(d=>d[key]),max=Math.max(...vals)*1.12,min=key==='rate'?Math.max(0,Math.min(...vals)*0.7):0;
  const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b, n=rows.length;
  const x=i=>pad.l+(i/(n-1))*iw, y=v=>pad.t+ih-((v-min)/(max-min||1))*ih;
  const pts=rows.map((d,i)=>[x(i),y(d[key])]);
  const p=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=`M${pts[0][0]} ${pad.t+ih} `+pts.map(q=>'L'+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')+` L${pts.at(-1)[0]} ${pad.t+ih} Z`;
  const ac=css('--blue'); let gy='';
  for(let i=0;i<=4;i++){const v=min+(max-min)*i/4,yy=y(v); gy+=`<line x1="${pad.l}" y1="${yy.toFixed(1)}" x2="${W-pad.r}" y2="${yy.toFixed(1)}" stroke="${css('--grid')}"/><text x="${pad.l-8}" y="${yy+3.5}" text-anchor="end">${keyfmt(v)}</text>`;}
  let gx=''; rows.forEach((d,i)=>{if(i%2===0||i===n-1)gx+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${d.label}</text>`;});
  const dots=pts.map((q,i)=>i===n-1?`<circle cx="${q[0]}" cy="${q[1]}" r="7" fill="${ac}" opacity=".16"/><circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${ac}" stroke="${css('--surface')}" stroke-width="2"/>`:'').join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${ac}" stop-opacity=".20"/><stop offset="1" stop-color="${ac}" stop-opacity="0"/></linearGradient></defs>${gy}${gx}<path d="${area}" fill="url(#lg)"/><path class="ln" d="${p}" fill="none" stroke="${ac}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>${dots}<line id="cxl" y1="${pad.t}" y2="${pad.t+ih}" stroke="${ac}" stroke-width="1" opacity="0"/><circle id="cdl" r="5" fill="${ac}" stroke="${css('--surface')}" stroke-width="2" opacity="0"/><rect id="htl" x="${pad.l}" y="${pad.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const ln=el.querySelector('.ln'); if(ln&&!rm){const L=ln.getTotalLength(); ln.style.strokeDasharray=L; ln.style.strokeDashoffset=L; ln.getBoundingClientRect(); ln.style.transition='stroke-dashoffset 1.1s ease'; ln.style.strokeDashoffset=0;}
  const svg=el.querySelector('svg'),ht=el.querySelector('#htl'),cx=el.querySelector('#cxl'),cd=el.querySelector('#cdl'),tt=$('#tt');
  ht.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*W;let i=Math.round((sx-pad.l)/iw*(n-1));i=Math.max(0,Math.min(n-1,i));const d=rows[i],px=x(i),py=y(d[key]);
    cx.setAttribute('x1',px);cx.setAttribute('x2',px);cx.setAttribute('opacity','.45');cd.setAttribute('cx',px);cd.setAttribute('cy',py);cd.setAttribute('opacity','1');
    tt.style.left=(r.left+px/W*r.width)+'px';tt.style.top=(r.top+py/H*r.height)+'px';tt.style.opacity='1';
    tt.innerHTML=`<div class="tt-t">${d.label}</div><div class="tt-r">Impressions <b>${fmt(d.impressions)}</b></div><div class="tt-r">Engagement <b>${fmt(d.engagement)}</b></div><div class="tt-r">Eng. rate <b>${d.rate.toFixed(1)}%</b></div><div class="tt-r">Posts <b>${d.posts}</b></div>`;});
  ht.addEventListener('mouseleave',()=>{cx.setAttribute('opacity','0');cd.setAttribute('opacity','0');tt.style.opacity='0';});
}
function bars(el,rows,{max,fmtVal,suffix}={}){
  const mx=max||Math.max(...rows.map(r=>r.value))||1;
  el.innerHTML=rows.map(r=>{const w=(r.value/mx*100).toFixed(1),v=fmtVal?fmtVal(r):fmt(r.value);
    return `<div class="bar"><div class="bl">${r.color?`<span class="sw" style="background:${r.color}"></span>`:''}${r.label}</div><div class="trk"><div class="fl" data-w="${w}" style="background:${r.color||css('--blue')}"></div></div><div class="bv">${v}${suffix||r.suffix||''} ${r.sub?`<span class="bs">${r.sub}</span>`:''}</div></div>`;}).join('');
  requestAnimationFrame(()=>$$('.fl',el).forEach(f=>f.style.width=f.dataset.w+'%'));
}

/* ---- comparison table (totals+platform+channel) ---- */
function cmpTable(el,rows){
  // rows: [{name,platform?,now,prev}]
  const mCols=[['posts','Posts',false],['impressions','Impr',false],['reach','Reach',false],['engagement','Eng',false],['rate','Eng rate',true],['clicks','Clicks',false]];
  let h='<div class="tblwrap"><table class="tbl"><thead><tr><th>'+(rows[0].platform!==undefined?'Channel':'Platform')+'</th>'+mCols.map(c=>`<th>${c[1]}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr><td><span class="nm">'+sw(r.platform||r.name)+r.name+'</span></td>';
    mCols.forEach(([k,,isRate])=>{
      const now=r.now[k], prev=r.prev[k];
      if(k==='reach' && now===0 && prev===0){ h+='<td><span style="color:var(--muted)">—</span></td>'; return; }
      const val=isRate?now.toFixed(1)+'%':fmt(now);
      const d=isRate?ppDelta(now,prev):pctDelta(now,prev);
      const neutral=(k==='posts');
      let cd;
      if(isRate){ cd=dcInline(d); }
      else if(neutral){ cd=`<span class="dc flat">${absDelta(now,prev)}</span>`; }
      else { cd=`${dcInline(d)} <span class="cabs">${absDelta(now,prev)}</span>`; }
      h+=`<td><div class="cell"><span>${val}</span><span class="cd">${cd}</span></div></td>`;
    });
    h+='</tr>';
  });
  el.innerHTML=h+'</tbody></table></div>';
}
function totalsCards(el,now,prev,partialNote){
  const defs=[['impressions','Impressions',false],['engagement','Engagement',false],['rate','Engagement rate',true],['reach','Reach',false],['posts','Posts',false],['clicks','Clicks',false]];
  el.innerHTML=defs.map(([k,lab,isRate])=>{
    const d=isRate?ppDelta(now[k],prev[k]):pctDelta(now[k],prev[k]);
    const val=isRate?now[k].toFixed(1)+'<small>%</small>':fmt(now[k]);
    const pv=isRate?prev[k].toFixed(1)+'%':fmt(prev[k]);
    const ad=isRate?'':`<b class="tnum" style="color:var(--ink)">${absDelta(now[k],prev[k])}</b>`;
    return `<div class="dcard"><div class="dl">${lab}</div><div class="dv tnum">${val}</div><div class="dr">${deltaChip(d)} ${ad} <span>vs ${pv} prior</span></div></div>`;
  }).join('');
}

/* ---- insights (derived) ---- */
function buildInsights(){
  const ch=DATA.channels_full, tot=DATA.overall;
  const big=[...ch].sort((a,b)=>b.impressions-a.impressions)[0];
  const share=Math.round(big.impressions/tot.impressions*100);
  const strong=[...ch].filter(c=>c.posts>=10).sort((a,b)=>b.rate-a.rate)[0];
  const weak=[...ch].filter(c=>c.posts>=20).sort((a,b)=>a.rate-b.rate)[0];
  const mNow=DATA.monthly.at(-1), mPrev=DATA.monthly.at(-2);
  const rateDir=mNow.rate>=mPrev.rate;
  const bestDay=[...DATA.dow].filter(d=>d.posts>=10).sort((a,b)=>b.rate-a.rate)[0];
  const bestDp=[...DATA.daypart].filter(d=>d.posts>=10).sort((a,b)=>b.rate-a.rate)[0];
  const out=[];
  out.push({k:'win',t:`<b>${strong.name} is your strongest channel</b> — ${strong.rate.toFixed(1)}% engagement across ${strong.posts} posts${strong.ctr>1?`, and it drives real clicks (${strong.ctr.toFixed(1)}% CTR)`:''}. This is where the audience actually responds.`});
  out.push({k:'',t:`<b>One channel carries reach:</b> ${big.name} generates ${share}% of all impressions (${fmt(big.impressions)}), at a ${big.rate.toFixed(1)}% rate — the volume engine, distinct from the highest-efficiency channels.`});
  out.push({k: rateDir?'win':'risk', t:`<b>${mNow.label} engagement rate ${rateDir?'rose':'slipped'} to ${mNow.rate.toFixed(1)}%</b> (from ${mPrev.rate.toFixed(1)}% in ${mPrev.label})${!rateDir?` even as posting volume ${mNow.posts>=mPrev.posts?'rose to '+mNow.posts:'held near '+mNow.posts} — more posts, thinner engagement.`:'.'}`});
  out.push({k:'risk',t:`<b>${weak.name} is the weak link:</b> ${weak.posts} posts at just ${weak.rate.toFixed(1)}% — high effort, low return. A candidate to rethink cadence or repurpose.`});
  if(bestDay&&bestDp) out.push({k:'',t:`<b>Timing edge:</b> ${bestDay.t} and the ${bestDp.t} window land the strongest engagement rates (${bestDay.rate.toFixed(1)}% / ${bestDp.rate.toFixed(1)}%). Worth concentrating priority posts there.`});
  return out;
}

/* ---- heatmap color (brand blue ramp) ---- */
function heatColor(v){
  const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
  const st=dark?['#132131','#163350','#164a78','#1560a5','#2c93ff','#5aabff','#8cc6ff']:['#eaf3ff','#c9e2ff','#9ccaff','#5aabff','#2c93ff','#1372dc','#0a53a8'];
  const lo=0.4,hi=3.0,t=Math.max(0,Math.min(1,(v-lo)/(hi-lo)));return st[Math.round(t*(st.length-1))];
}

/* ================= ASK — natural-language query over the embedded data (100% client-side) ================= */
let ASK_PENDING=null;
const CH_LOOKUP=(DATA.meta&&DATA.meta.chan_lookup)||{};
const MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
const PLAT_RX=[['LinkedIn',/\blinkedin\b|\blinked in\b/],['Instagram',/\binstagram\b|\binsta\b|\big\b/],['YouTube',/\byoutube\b|\byt\b/],['TikTok',/\btiktok\b|\btik tok\b/],['Twitter/X',/\btwitter\b|\btweet\b|\bx\b/],['Facebook',/\bfacebook\b|\bfb\b|\bmeta\b/]];
const METRIC_DEFS=[
 {id:'rate',label:'Engagement rate',type:'pct',syn:['engagement rate','eng rate','engagement-rate','interaction rate']},
 {id:'ctr',label:'CTR',type:'pct',syn:['ctr','click through','click-through','clickthrough']},
 {id:'impressions',label:'Impressions',type:'int',syn:['impression','impressions','views']},
 {id:'reach',label:'Reach',type:'int',syn:['reach']},
 {id:'engagement',label:'Engagement',type:'int',syn:['engagement','engagements','interaction','interactions','engaged']},
 {id:'clicks',label:'Clicks',type:'int',syn:['clicks','click']},
 {id:'posts',label:'Posts',type:'int',syn:['posts','post ','published','how many post']},
];
const EMAIL_METRICS=[
 {id:'eopen',f:'open_rate',type:'pct',label:'Open rate',syn:['open rate','open %','opens rate']},
 {id:'eclick',f:'click_rate',type:'pct',label:'Click rate',syn:['click rate','click %']},
 {id:'eunsub',f:'unsub_rate',type:'pct',label:'Unsubscribe rate',syn:['unsub','unsubscribe','unsubscribed']},
 {id:'esubs',f:'subscribers',type:'int',label:'Subscribers',syn:['subscriber','subscribers','list size','audience size']},
 {id:'esent',f:'sent',type:'int',label:'Emails sent',syn:['emails sent','broadcasts','how many email','number of email']},
 {id:'eopens',f:'total_opened',type:'int',label:'Opens',syn:['opens','opened']},
 {id:'eclicks',f:'total_clicked',type:'int',label:'Email clicks',syn:['email clicks']},
];
const askFmt=(v,t)=>(v==null||v==='')?'—':(t==='pct'?(Math.round(v*10)/10).toFixed(1)+'%':fmt(v));
function isoWeek(ymd){const d=new Date(ymd+'T00:00:00Z');const dn=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-dn+3);const ft=new Date(Date.UTC(d.getUTCFullYear(),0,4));const wk=1+Math.round(((d-ft)/864e5-3+((ft.getUTCDay()+6)%7))/7);return d.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');}
function findMetric(q,defs){for(const m of defs){for(const s of m.syn){if(q.includes(s))return m;}}return null;}
function findPlatform(q){for(const [n,rx] of PLAT_RX){if(rx.test(q))return n;}return null;}
function findDim(q){for(const c of DATA.channels_full){const bare=c.name.replace(/-/g,'');if(q.replace(/[-\s]/g,'').includes(bare))return{kind:'channel',value:c.name};}const p=findPlatform(q);return p?{kind:'platform',value:p}:null;}
function monthObj(name){return DATA.monthly.find(m=>m.label.toLowerCase().startsWith(name));}
function findPeriod(q){
 let mw=q.match(/\b(?:week|w)\s?-?(\d{1,2})\b/);
 if(mw){const wk=DATA.weekly.find(w=>w.week.endsWith('W'+mw[1].padStart(2,'0')));if(wk)return{kind:'week',obj:wk,label:'week '+wk.week.split('-W')[1]+' ('+wk.label+')'};}
 if(/this week|current week|latest week/.test(q))return{kind:'week',obj:DATA.weekly.at(-1),label:'this week ('+DATA.weekly.at(-1).week+')'};
 if(/last week|previous week|prior week/.test(q))return{kind:'week',obj:DATA.weekly.at(-2),label:'last week ('+DATA.weekly.at(-2).week+')'};
 for(let i=0;i<12;i++){if(new RegExp('\\b'+MONTHS[i].slice(0,3)+'[a-z]*\\b').test(q)){const mo=monthObj(MONTHS[i]);if(mo)return{kind:'month',obj:mo,label:mo.label};}}
 if(/this month|current month|latest month/.test(q))return{kind:'month',obj:DATA.monthly.at(-1),label:'this month ('+DATA.monthly.at(-1).label+')'};
 if(/last month|previous month|prior month/.test(q))return{kind:'month',obj:DATA.monthly.at(-2),label:'last month ('+DATA.monthly.at(-2).label+')'};
 return null;
}
function findAllPeriods(q){const res=[],seen=new Set();
 const found=[];
 for(let i=0;i<12;i++){const m=q.match(new RegExp('\\b'+MONTHS[i].slice(0,3)+'[a-z]*\\b'));if(m){const mo=monthObj(MONTHS[i]);if(mo)found.push({pos:m.index,p:{kind:'month',obj:mo,label:mo.label}});}}
 found.sort((a,b)=>a.pos-b.pos).forEach(f=>{if(!seen.has(f.p.label)){res.push(f.p);seen.add(f.p.label);}});
 const re=/\b(?:week|w)\s?-?(\d{1,2})\b/g;let m;while((m=re.exec(q))){const wk=DATA.weekly.find(w=>w.week.endsWith('W'+m[1].padStart(2,'0')));if(wk&&!seen.has(wk.week)){res.push({kind:'week',obj:wk,label:'W'+wk.week.split('-W')[1]});seen.add(wk.week);}}
 return res;
}
function aggRows(rows){let im=0,en=0,ck=0;rows.forEach(r=>{im+=r.im||0;en+=r.en||0;ck+=r.ck||0;});return{impressions:im,engagement:en,posts:rows.length,clicks:ck,rate:im?en/im*100:0,ctr:im?ck/im*100:0,reach:null};}
function answerQuestion(raw){
 const q=' '+raw.toLowerCase().replace(/[?,.]/g,' ').replace(/\s+/g,' ')+' ';
 const ok=(metric,scope,value,note,extra)=>({ok:true,metric,scope,value,note,extra});
 // ---- email domain ----
 if(/\bemail|newsletter|broadcast|kit\b|subscriber|unsub|open rate/.test(q) && EMAIL.properties.length){
   const P=EMAIL.data[EMAIL.current]; let mkey=P.latest;
   for(let i=0;i<12;i++){if(new RegExp('\\b'+MONTHS[i].slice(0,3)+'[a-z]*\\b').test(q)){const f=P.months.find(x=>x.label.toLowerCase().startsWith(MONTHS[i]));if(f)mkey=f.key;}}
   const m=P.byMonth[mkey]; const em=findMetric(q,EMAIL_METRICS)||EMAIL_METRICS[0];
   return ok(em.label, EMAIL.current+' email · '+m.label, askFmt(m[em.f],em.type), 'from Kit email data');
 }
 const op=/\bcompare|versus|\bvs\b|\bvs\.|difference between/.test(q)?'compare':/\bbest|highest|\btop\b|most|strongest|maximum|\bmax\b/.test(q)?'best':/\bworst|lowest|least|weakest|minimum|\bmin\b/.test(q)?'worst':'value';
 const metric=findMetric(q,METRIC_DEFS);
 // ---- best / worst ----
 if(op==='best'||op==='worst'){
   const met=metric||METRIC_DEFS[0]; const dir=op==='best'?1:-1; let items,scope;
   if(/\bweek/.test(q)){items=DATA.weekly.map(w=>({n:'W'+w.week.split('-W')[1]+' ('+w.label+')',v:w[met.id]}));scope='week';}
   else if(/\bmonth/.test(q)){items=DATA.monthly.map(m=>({n:m.label,v:m[met.id]}));scope='month';}
   else if(/\bchannel/.test(q)){items=DATA.channels_full.map(c=>({n:c.name,v:c[met.id]}));scope='channel';}
   else{items=DATA.platforms_full.map(p=>({n:p.name,v:p[met.id]}));scope='platform';}
   items.sort((a,b)=>dir*(b.v-a.v)); const t=items[0];
   return ok((op==='best'?'Best ':'Worst ')+scope+' by '+met.label, t.n, askFmt(t.v,met.type), 'scanned '+items.length+' '+scope+'s');
 }
 // ---- compare ----
 if(op==='compare'){
   const ps=findAllPeriods(q); const met=metric||METRIC_DEFS[2];
   if(ps.length>=2){const a=ps[0],b=ps[1],va=a.obj[met.id],vb=b.obj[met.id],d=va-vb,pc=vb?d/vb*100:0;
     return ok('Compare · '+met.label, a.label+' vs '+b.label, askFmt(va,met.type)+'  vs  '+askFmt(vb,met.type), 'change from '+b.label+' to '+a.label, (d>=0?'▲ +':'▼ ')+askFmt(Math.abs(d),met.type)+' ('+(pc>=0?'+':'')+Math.round(pc)+'%)');}
 }
 // ---- value ----
 const dim=findDim(q), period=findPeriod(q);
 if(!metric && !dim && !period) return {ok:false};
 const met=metric||METRIC_DEFS[2]; // default impressions
 if(dim){
   if(period && (period.kind==='month'||period.kind==='week')){
     if(met.id==='reach') return ok('Reach', dim.value+' · '+period.label, '—', 'Reach isn’t reported at a platform/channel × time breakdown — ask for impressions or engagement here, or reach without the time filter.');
     const rows=DATA.posts_table.filter(r=>(period.kind==='month'?(r.ymd||'').startsWith(period.obj.month):isoWeek(r.ymd)===period.obj.week) && (dim.kind==='platform'?r.pl===dim.value:CH_LOOKUP[r.pl+'|'+r.pr]===dim.value));
     const a=aggRows(rows);
     return ok(met.label, dim.value+' · '+period.label, askFmt(a[met.id],met.type), 'computed from '+rows.length+' posts');
   }
   const src=dim.kind==='platform'?DATA.platforms_full.find(p=>p.name===dim.value):DATA.channels_full.find(c=>c.name===dim.value);
   return ok(met.label, dim.value+' · whole window', askFmt(src[met.id],met.type), 'from '+dim.kind+' totals (Jun 1 – '+DATA.meta.date_max+')');
 }
 const src=period?period.obj:DATA.overall;
 return ok(met.label, period?period.label:('whole window (Jun 1 – '+DATA.meta.date_max+')'), askFmt(src[met.id],met.type), period?('from '+period.kind+' totals'):'from window totals');
}
